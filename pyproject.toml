[project]
name = "vpn-gateway-pi"
version = "0.1.0"
description = "Raspberry Pi VPN gateway backend and Windows management GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
]

[project.scripts]
vpn-gateway-cli = "vpn_gateway.cli:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=8.3.0",
]
gui = [
    "PySide6>=6.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vpn_gateway*", "vpn_gateway_gui*"]
